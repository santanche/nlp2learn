services:
  data-prep:
    build:
      context: .
      dockerfile: env/data-prep/Dockerfile
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./:/home/jovyan/work

  kg-extraction:
    build:
      context: .
      dockerfile: env/kg-extraction/Dockerfile
    ports:
      - "127.0.0.1:8889:8888"
    volumes:
      - ./:/home/jovyan/work
    environment:
      # Override to bolt://neo4j:7687 when also running the neo4j service below
      # (docker compose --profile graph up kg-extraction neo4j).
      - NEO4J_URI=bolt://localhost:7687

  # Optional local Cypher demo for Stage 8 of 02_kg_extraction.ipynb. Not
  # started by `docker compose up` on its own — needs the "graph" profile:
  #   docker compose --profile graph up neo4j
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/localdevpassword
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
