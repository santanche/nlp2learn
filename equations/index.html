<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaTeX Equation Renderer</title>
  <script>
    window.MathJax = {
      loader: { load: ['input/tex', 'output/svg'] },
      options: { enableAssistiveMml: false },
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      },
      svg: { fontCache: 'none' },
      startup: { typeset: false }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d9dee8;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --danger: #b42318;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 2.2vw, 2.25rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .status {
      min-height: 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: right;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
    }

    .controls {
      padding: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #344054;
      font-size: 0.9rem;
      font-weight: 650;
    }

    textarea,
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    textarea {
      min-height: 230px;
      padding: 12px;
      resize: vertical;
      line-height: 1.45;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    textarea:focus,
    input[type="number"]:focus,
    button:focus-visible {
      outline: 3px solid rgba(15, 118, 110, 0.22);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .field {
      margin-bottom: 16px;
    }

    .size-row {
      display: grid;
      grid-template-columns: 1fr 86px;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"] {
      height: 40px;
      padding: 0 10px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button.secondary {
      border-color: var(--line);
      background: #fff;
      color: #344054;
    }

    button:hover {
      background: var(--accent-strong);
    }

    button.secondary:hover {
      background: #f2f4f7;
    }

    .preview-panel {
      overflow: hidden;
    }

    .preview-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .preview-wrap {
      min-height: 370px;
      overflow: auto;
      padding: 26px;
      background:
        linear-gradient(#eef1f6 1px, transparent 1px),
        linear-gradient(90deg, #eef1f6 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .equation-surface {
      display: inline-block;
      min-width: 100%;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 36px;
    }

    .equation-surface mjx-container {
      margin: 0;
    }

    .equation-surface mjx-assistive-mml {
      display: none;
    }

    .error {
      color: var(--danger);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    @media (max-width: 820px) {
      main {
        width: min(100vw - 20px, 680px);
        padding-top: 18px;
      }

      header {
        display: block;
      }

      .status {
        margin-top: 8px;
        text-align: left;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>LaTeX Equation Renderer</h1>
      <div class="status" id="status">Loading MathJax...</div>
    </header>

    <div class="workspace">
      <section class="panel controls" aria-label="Equation controls">
        <div class="field">
          <label for="latex-input">LaTeX equation</label>
          <textarea id="latex-input" spellcheck="false">\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}</textarea>
        </div>

        <div class="field">
          <label for="font-size">Font size</label>
          <div class="size-row">
            <input id="font-size-range" type="range" min="12" max="120" step="1" value="36">
            <input id="font-size" type="number" min="12" max="120" step="1" value="36" aria-label="Font size in pixels">
          </div>
        </div>

        <div class="actions">
          <button id="copy-svg" type="button">Copy SVG</button>
          <button id="copy-png" type="button">Copy PNG</button>
          <button id="download-svg" class="secondary" type="button">Download SVG</button>
          <button id="download-png" class="secondary" type="button">Download PNG</button>
        </div>
      </section>

      <section class="panel preview-panel" aria-label="Equation preview">
        <div class="preview-toolbar">
          <span>Preview</span>
          <span id="dimensions">-</span>
        </div>
        <div class="preview-wrap">
          <div id="equation-surface" class="equation-surface"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const input = document.getElementById('latex-input');
    const surface = document.getElementById('equation-surface');
    const statusEl = document.getElementById('status');
    const dimensionsEl = document.getElementById('dimensions');
    const sizeRange = document.getElementById('font-size-range');
    const sizeInput = document.getElementById('font-size');
    const copySvgButton = document.getElementById('copy-svg');
    const copyPngButton = document.getElementById('copy-png');
    const downloadSvgButton = document.getElementById('download-svg');
    const downloadPngButton = document.getElementById('download-png');

    let renderTimer;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? 'var(--danger)' : 'var(--muted)';
    }

    function normalizeEquation(value) {
      const trimmed = value.trim();
      if (!trimmed) return { math: '', display: true };

      if (trimmed.startsWith('$$') && trimmed.endsWith('$$')) {
        return { math: trimmed.slice(2, -2).trim(), display: true };
      }

      if (trimmed.startsWith('\\[') && trimmed.endsWith('\\]')) {
        return { math: trimmed.slice(2, -2).trim(), display: true };
      }

      if (trimmed.startsWith('\\(') && trimmed.endsWith('\\)')) {
        return { math: trimmed.slice(2, -2).trim(), display: false };
      }

      return { math: trimmed, display: true };
    }

    function clampFontSize(value) {
      const parsed = Number.parseInt(value, 10);
      if (Number.isNaN(parsed)) return 36;
      return Math.min(120, Math.max(12, parsed));
    }

    function syncFontSize(value) {
      const next = clampFontSize(value);
      sizeInput.value = next;
      sizeRange.value = next;
      surface.style.fontSize = `${next}px`;
      updateDimensions();
    }

    async function waitForMathJax() {
      while (!window.MathJax || !window.MathJax.tex2svgPromise) {
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
    }

    async function renderEquation() {
      const equation = normalizeEquation(input.value);
      if (!equation.math) {
        surface.innerHTML = '';
        dimensionsEl.textContent = '-';
        setStatus('Waiting for input');
        return;
      }

      try {
        await waitForMathJax();
        const node = await MathJax.tex2svgPromise(equation.math, { display: equation.display });
        node.querySelectorAll('mjx-assistive-mml').forEach((assistiveNode) => assistiveNode.remove());
        surface.replaceChildren(node);
        updateDimensions();
        setStatus('Rendered');
      } catch (error) {
        surface.innerHTML = `<div class="error">${escapeHtml(error.message || String(error))}</div>`;
        dimensionsEl.textContent = '-';
        setStatus('Could not render equation', true);
      }
    }

    function queueRender() {
      window.clearTimeout(renderTimer);
      renderTimer = window.setTimeout(renderEquation, 160);
    }

    function escapeHtml(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getRenderedSvg() {
      const svg = surface.querySelector('svg');
      if (!svg) throw new Error('Render an equation first.');

      const clone = svg.cloneNode(true);
      const bounds = svg.getBoundingClientRect();
      const width = Math.ceil(bounds.width);
      const height = Math.ceil(bounds.height);

      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', String(width));
      clone.setAttribute('height', String(height));
      clone.setAttribute('style', 'background: transparent;');

      return {
        svgText: new XMLSerializer().serializeToString(clone),
        width,
        height
      };
    }

    function svgTextToBlob(svgText) {
      return new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
    }

    async function svgToPngBlob(scale = 3) {
      const { svgText, width, height } = getRenderedSvg();
      const svgBlob = svgTextToBlob(svgText);
      const url = URL.createObjectURL(svgBlob);

      try {
        const image = new Image();
        image.decoding = 'async';
        image.src = url;
        await image.decode();

        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.ceil(width * scale));
        canvas.height = Math.max(1, Math.ceil(height * scale));

        const context = canvas.getContext('2d');
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        return await new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            blob ? resolve(blob) : reject(new Error('Could not create PNG.'));
          }, 'image/png');
        });
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function copyBlob(blob, mimeType, successMessage) {
      if (!navigator.clipboard || !window.ClipboardItem) {
        throw new Error('Clipboard image copying requires a secure browser context, such as http://localhost.');
      }

      await navigator.clipboard.write([
        new ClipboardItem({ [mimeType]: blob })
      ]);
      setStatus(successMessage);
    }

    async function copySvg() {
      try {
        const { svgText } = getRenderedSvg();
        const blob = svgTextToBlob(svgText);

        try {
          await copyBlob(blob, 'image/svg+xml', 'Copied SVG image');
        } catch {
          if (!navigator.clipboard || !navigator.clipboard.writeText) {
            throw new Error('Clipboard copying requires a secure browser context, such as http://localhost.');
          }

          await navigator.clipboard.writeText(svgText);
          setStatus('Copied SVG markup');
        }
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    }

    async function copyPng() {
      try {
        const blob = await svgToPngBlob();
        await copyBlob(blob, 'image/png', 'Copied PNG image');
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function downloadSvg() {
      try {
        const { svgText } = getRenderedSvg();
        downloadBlob(svgTextToBlob(svgText), 'equation.svg');
        setStatus('Downloaded SVG');
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    }

    async function downloadPng() {
      try {
        const blob = await svgToPngBlob();
        downloadBlob(blob, 'equation.png');
        setStatus('Downloaded PNG');
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    }

    function updateDimensions() {
      const svg = surface.querySelector('svg');
      if (!svg) {
        dimensionsEl.textContent = '-';
        return;
      }

      const bounds = svg.getBoundingClientRect();
      dimensionsEl.textContent = `${Math.ceil(bounds.width)} x ${Math.ceil(bounds.height)} px`;
    }

    input.addEventListener('input', queueRender);
    sizeRange.addEventListener('input', (event) => syncFontSize(event.target.value));
    sizeInput.addEventListener('input', (event) => syncFontSize(event.target.value));
    copySvgButton.addEventListener('click', copySvg);
    copyPngButton.addEventListener('click', copyPng);
    downloadSvgButton.addEventListener('click', downloadSvg);
    downloadPngButton.addEventListener('click', downloadPng);
    window.addEventListener('resize', updateDimensions);

    syncFontSize(sizeInput.value);
    renderEquation();
  </script>
</body>
</html>
